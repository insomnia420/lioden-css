<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐕𝐲𝐫𝐚𝐧𝐭𝐡𝐨𝐬's Den :|: Lioden</title>
    <base href="//www.lioden.com">
    <style>
        /* Basic styling for the page */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }
        main {
            background: white;
            padding: 20px;
            border-radius: 5px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <h2>About This Page</h2>
        <p>This is a simple HTML page with some basic elements like headings, paragraphs, images, and forms.</p>

        <h3>Sample Image</h3>
        <img src="https://via.placeholder.com/400x200" alt="Sample placeholder image">

        <h3>Useful Link</h3>
        <p>Visit <a href="https://www.w3schools.com/html/" target="_blank">W3Schools HTML Tutorial</a> to learn more.</p>

        <h3>Contact Form</h3>
        <form action="#" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" required></textarea><br><br>

            <button type="submit">Send</button>
        </form>
    </main>

    <footer>
        &copy; 2026 My Website. All rights reserved.
    </footer>

</body>
</html>
